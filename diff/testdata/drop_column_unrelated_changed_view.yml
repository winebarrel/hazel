init: |
  CREATE TABLE t (a, b);
  CREATE TABLE u (x, y);
  CREATE VIEW va AS SELECT a FROM t;
  CREATE VIEW vb AS SELECT a FROM va;
# The DROP COLUMN is on u, which no view uses, but it still checks vb, which
# reads va, which is dropped.
desired: |
  CREATE TABLE t (a, b);
  CREATE TABLE u (x);
  CREATE VIEW va AS SELECT a, b FROM t;
  CREATE VIEW vb AS SELECT a FROM va;
plan: |
  -- WARNING: the following will be dropped and their data will be lost:
  --   column u.y
  --
  -- drop and create: definition changed
  DROP VIEW va;
  -- drop and create: depends on va, which is created again
  DROP VIEW vb;
  -- drop: removed from schema
  ALTER TABLE u DROP COLUMN y;
  CREATE VIEW va AS SELECT a, b FROM t;
  CREATE VIEW vb AS SELECT a FROM va;
