init: |
  CREATE TABLE t (a, b, UNIQUE (a));
desired: |
  CREATE TABLE t (a, b, UNIQUE (b));
plan: |
  -- table rebuild: t (UNIQUE constraint)
  CREATE TABLE new_t (
      a,
      b,
      UNIQUE (b)
  );
