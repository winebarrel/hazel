init: |
  CREATE TABLE t (
    a INT CHECK (a != 0),
    b TEXT DEFAULT 16,
    c TEXT DEFAULT CURRENT_TIMESTAMP,
    d INT AS (a + 1),
    CONSTRAINT b_short CHECK (length(b) < 10)
  );
  CREATE INDEX t_lower_b ON t (lower(b));
  CREATE INDEX t_a ON t (a) WHERE a != 0;
  CREATE VIEW v AS SELECT a, b FROM t WHERE a != 0;
  CREATE VIEW w AS SELECT a FROM v ORDER BY a;
