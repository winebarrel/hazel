init: |
  CREATE TABLE p (id INTEGER PRIMARY KEY);
  CREATE TABLE t (a REFERENCES p (id));
desired: |
  CREATE TABLE p (id INTEGER PRIMARY KEY);
  CREATE TABLE t (a);
plan: |
  -- table rebuild: t (FOREIGN KEY constraint)
  CREATE TABLE new_t (
      a
  );
  INSERT INTO new_t (rowid, a) SELECT rowid, a FROM t;
  DROP TABLE t;
  ALTER TABLE new_t RENAME TO t;
