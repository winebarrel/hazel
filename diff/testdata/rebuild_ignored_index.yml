init: |
  CREATE TABLE t (a INT, b);
  CREATE INDEX t_b ON t (b);
# DROP TABLE takes the ignored index with it, so it is created again as
# current has it.
desired: |
  CREATE TABLE t (a TEXT, b);
  -- hazel:ignore
  CREATE INDEX t_b ON t (b, a);
plan: |
  -- table rebuild: t (type of a)
  CREATE TABLE new_t (a TEXT, b);
  INSERT INTO new_t (a, b) SELECT a, b FROM t;
  DROP TABLE t;
  ALTER TABLE new_t RENAME TO t;
  CREATE INDEX t_b ON t (b);
