init: |
  CREATE TABLE users (id INTEGER PRIMARY KEY, name TEXT, age TEXT, legacy TEXT);
  CREATE TABLE posts (id INTEGER PRIMARY KEY, user_id INTEGER REFERENCES users (id));
  CREATE TABLE log (x);
  CREATE INDEX users_name ON users (name);
  CREATE INDEX users_age ON users (age);
  CREATE TRIGGER users_ai AFTER INSERT ON users BEGIN INSERT INTO log VALUES (new.id); END;
  CREATE TRIGGER posts_ai AFTER INSERT ON posts BEGIN SELECT name FROM users; END;
  CREATE VIEW user_names AS SELECT id, name FROM users;
  CREATE VIEW post_count AS SELECT count(*) FROM posts;
# The rebuild makes the ALTER-able changes too (email is added, legacy is
# dropped), the indexes and the trigger of users go with DROP TABLE and are
# created again, and what names users is dropped and created again. The
# foreign key of posts names users and needs nothing.
desired: |
  CREATE TABLE users (id INTEGER PRIMARY KEY, name TEXT, age INTEGER, email TEXT DEFAULT '');
  CREATE TABLE posts (id INTEGER PRIMARY KEY, user_id INTEGER REFERENCES users (id));
  CREATE TABLE log (x);
  CREATE INDEX users_name ON users (name);
  CREATE INDEX users_age ON users (age) WHERE age > 0;
  CREATE TRIGGER users_ai AFTER INSERT ON users BEGIN INSERT INTO log VALUES (new.id); END;
  CREATE TRIGGER posts_ai AFTER INSERT ON posts BEGIN SELECT name FROM users; END;
  CREATE VIEW user_names AS SELECT id, name FROM users;
  CREATE VIEW post_count AS SELECT count(*) FROM posts;
plan: |
  -- WARNING: the following will be dropped and their data will be lost:
  --   column users.legacy
  --
  -- drop and create: depends on users, which is rebuilt
  DROP VIEW user_names;
  DROP TRIGGER posts_ai;
  -- table rebuild: users (type of age; drops column legacy; adds column email)
  CREATE TABLE new_users (id INTEGER PRIMARY KEY, name TEXT, age INTEGER, email TEXT DEFAULT '');
  INSERT INTO new_users (id, name, age) SELECT id, name, age FROM users;
  DROP TABLE users;
  ALTER TABLE new_users RENAME TO users;
  CREATE INDEX users_name ON users (name);
  CREATE INDEX users_age ON users (age) WHERE age > 0;
  CREATE VIEW user_names AS SELECT id, name FROM users;
  CREATE TRIGGER users_ai AFTER INSERT ON users BEGIN INSERT INTO log VALUES (new.id); END;
  CREATE TRIGGER posts_ai AFTER INSERT ON posts BEGIN SELECT name FROM users; END;
