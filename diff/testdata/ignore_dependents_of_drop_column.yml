init: |
  CREATE TABLE t (a, b);
  CREATE VIEW v AS SELECT a, b FROM t;
  CREATE VIEW w AS SELECT a FROM v;
# w reads v, which is dropped, so DROP COLUMN fails while w is there. w is
# ignored, so nothing is planned for it, and the apply fails: dropping the
# column means not ignoring what stands in its way.
desired: |
  CREATE TABLE t (a);
  CREATE VIEW v AS SELECT a FROM t;
  -- hazel:ignore
  CREATE VIEW w AS SELECT a AS z FROM v;
plan: |
  -- WARNING: the following will be dropped and their data will be lost:
  --   column t.b
  --
  -- drop and create: definition changed
  DROP VIEW v;
  -- drop: removed from schema
  ALTER TABLE t DROP COLUMN b;
  CREATE VIEW v AS SELECT a FROM t;
apply_error: "error in view w"
