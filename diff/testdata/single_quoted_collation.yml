init: |
  CREATE TABLE t (id INTEGER PRIMARY KEY, 'b' TEXT COLLATE NOCASE);
desired: |
  CREATE TABLE t (id INTEGER PRIMARY KEY, 'b' TEXT COLLATE BINARY);
plan: |
  -- table rebuild: t (COLLATE of b)
  CREATE TABLE new_t (
      id INTEGER PRIMARY KEY,
      'b' TEXT COLLATE BINARY
