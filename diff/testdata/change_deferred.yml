init: |
  CREATE TABLE p (id INTEGER PRIMARY KEY); CREATE TABLE t (a REFERENCES p (id));
desired: |
  CREATE TABLE p (id INTEGER PRIMARY KEY); CREATE TABLE t (a REFERENCES p (id) DEFERRABLE INITIALLY DEFERRED);
plan: |
  -- table rebuild: t (FOREIGN KEY constraint)
  CREATE TABLE new_t (a REFERENCES p (id) DEFERRABLE INITIALLY DEFERRED);
  INSERT INTO new_t (a) SELECT a FROM t;
  DROP TABLE t;
  ALTER TABLE new_t RENAME TO t;
