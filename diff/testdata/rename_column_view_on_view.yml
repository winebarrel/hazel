init: |
  CREATE TABLE t (a, b);
  CREATE VIEW va AS SELECT a, b FROM t;
  CREATE VIEW vb AS SELECT a FROM va;
# RENAME COLUMN checks every view and trigger in the schema, as DROP COLUMN
# does. vb reads va, which is dropped before it, so vb is dropped and created
# too.
desired: |
  CREATE TABLE t (
    a,
    -- hazel:renamed-from b
    c
  );
  CREATE VIEW va AS SELECT a FROM t;
  CREATE VIEW vb AS SELECT a FROM va;
plan: |
  -- drop and create: definition changed
  DROP VIEW va;
  -- drop and create: depends on va, which is created again
  DROP VIEW vb;
  ALTER TABLE t RENAME COLUMN b TO c;
  CREATE VIEW va AS SELECT a FROM t;
  CREATE VIEW vb AS SELECT a FROM va;
