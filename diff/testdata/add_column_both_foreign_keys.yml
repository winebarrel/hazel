init: |
  CREATE TABLE users (id INTEGER PRIMARY KEY);
  CREATE TABLE posts (id INTEGER PRIMARY KEY);
# The REFERENCES in the definition comes with ADD COLUMN; the table-level
# FOREIGN KEY on the same column does not.
desired: |
  CREATE TABLE users (id INTEGER PRIMARY KEY);
  CREATE TABLE posts (
    id INTEGER PRIMARY KEY,
    user_id INTEGER REFERENCES users (id),
    FOREIGN KEY (user_id) REFERENCES users (id) ON DELETE CASCADE
  );
error: "table posts: changing a FOREIGN KEY constraint is not supported yet"
