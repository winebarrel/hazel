init: |
  CREATE TABLE t (a PRIMARY KEY);
desired: |
  CREATE TABLE t (a PRIMARY KEY) WITHOUT ROWID;
plan: |
  -- table rebuild: t (WITHOUT ROWID; NOT NULL of a)
  CREATE TABLE new_t (
      a PRIMARY KEY
