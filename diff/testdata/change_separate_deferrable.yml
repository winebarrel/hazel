init: |
  CREATE TABLE p (id INTEGER PRIMARY KEY);
  CREATE TABLE t (a REFERENCES p (id) NOT NULL);
# The DEFERRABLE comes after NOT NULL, as a column constraint of its own,
# and still makes the foreign key deferred.
desired: |
  CREATE TABLE p (id INTEGER PRIMARY KEY);
  CREATE TABLE t (a REFERENCES p (id) NOT NULL DEFERRABLE INITIALLY DEFERRED);
error: "table t: changing a FOREIGN KEY constraint is not supported yet"
