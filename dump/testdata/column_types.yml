# The example type names of the affinity table in the SQLite documentation,
# a column with no type, and the types a STRICT table allows.
init: |
  CREATE TABLE t (
    int_a INT,
    int_b INTEGER,
    int_c TINYINT,
    int_d SMALLINT,
    int_e MEDIUMINT,
    int_f BIGINT,
    int_g UNSIGNED BIG INT,
    int_h INT2,
    int_i INT8,
    text_a CHARACTER(20),
    text_b VARCHAR(255),
    text_c VARYING CHARACTER(255),
    text_d NCHAR(55),
    text_e NATIVE CHARACTER(70),
    text_f NVARCHAR(100),
    text_g TEXT,
    text_h CLOB,
    blob_a BLOB,
    blob_b,
    real_a REAL,
    real_b DOUBLE,
    real_c DOUBLE PRECISION,
    real_d FLOAT,
    numeric_a NUMERIC,
    numeric_b DECIMAL(10, 5),
    numeric_c BOOLEAN,
    numeric_d DATE,
    numeric_e DATETIME
  );
  CREATE TABLE s (
    a INT,
    b INTEGER,
    c REAL,
    d TEXT,
    e BLOB,
    f ANY
  ) STRICT;
