site_name: hazel
site_description: Declarative schema management tool for SQLite
site_url: https://winebarrel.github.io/hazel/
repo_url: https://github.com/winebarrel/hazel
repo_name: winebarrel/hazel
edit_uri: edit/main/docs/

theme:
  name: material
  favicon: assets/favicon.ico
  # The header draws the logo at 24px next to site_name, so this is the nut
  # mark on its own; the full logo carries the wordmark.
  logo: assets/logo-mark.svg
  features:
    - navigation.sections
    - navigation.indexes
    # Opens every collapsible subsection, such as Commands, so the whole tree
    # is visible without clicking through it.
    - navigation.expand
    - navigation.top
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  # Listing plugins turns off the default set, so search has to be named again.
  - search
  # Generates a preview image per page and the og:/twitter: meta tags that point
  # at it, so a link to the site expands into a card.
  - social

hooks:
  - hooks.py

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  # The option lists on the command pages are definition lists.
  - def_list
  - pymdownx.superfences
  - toc:
      permalink: true

nav:
  - Home: index.md
  - installation.md
  - Getting started: getting-started.md
  - Guides:
      - guides/renaming.md
  - Reference:
      - Commands:
          - reference/commands/index.md
          - reference/commands/plan.md
          - reference/commands/apply.md
          - reference/commands/dump.md
          - reference/commands/fmt.md
          - reference/commands/diff.md
      - reference/objects.md
      - reference/directives.md
      - reference/configuration.md
      - reference/exit-status.md
  - Changelog: changelog.md
