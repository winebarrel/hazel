name: CI
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash -xeo pipefail {0}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ascii:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check for non-ASCII characters
        run: |
          matches=$(LC_ALL=C git grep -nIP '[^\x00-\x7F]' -- .) && status=0 || status=$?
          if [ "$status" -eq 0 ]; then
            echo "Error: non-ASCII characters found:"
            echo "$matches"
            exit 1
          elif [ "$status" -ne 1 ]; then
            echo "Error: git grep failed with status $status"
            exit "$status"
          fi

  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: make test-changelog

  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      # A diff here means go.mod or go.sum is stale: run `go mod tidy` and
      # commit it.
      - run: go mod tidy -diff

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9.3.0

  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -v -coverpkg=./... -coverprofile=coverage.txt ./...
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.txt
          flags: ${{ matrix.os }}

  # The real-world schema tests (REALWORLD-TESTS.md). The schema files are
  # pinned to commits and kept in the cache, keyed on realworld.mk, where the
  # pins are.
  realworld:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/cache@v6.1.0
        with:
          path: ${{ runner.temp }}/realworld-cache
          key: realworld-${{ hashFiles('realworld.mk') }}
      - run: make test-realworld
        env:
          REALWORLD_CACHE: ${{ runner.temp }}/realworld-cache
