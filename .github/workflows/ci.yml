name: CI
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash -xeo pipefail {0}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ascii:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check for non-ASCII characters
        run: |
          matches=$(LC_ALL=C git grep -nIP '[^\x00-\x7F]' -- .) && status=0 || status=$?
          if [ "$status" -eq 0 ]; then
            echo "Error: non-ASCII characters found:"
            echo "$matches"
            exit 1
          elif [ "$status" -ne 1 ]; then
            echo "Error: git grep failed with status $status"
            exit "$status"
          fi

  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      # A diff here means go.mod or go.sum is stale: run `go mod tidy` and
      # commit it.
      - run: go mod tidy -diff

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9.3.0

  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -v ./...
